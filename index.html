<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>if(location.protocol==='http:'&&!/^(localhost|127\.)/.test(location.hostname)){location.replace('https://'+location.host+location.pathname+location.search);}</script>
<title>羅家榮｜所有連結</title>
<meta name="description" content="酷澎・蝦皮的優惠，還有我自己做的線上下載工具與免費小遊戲。">
<meta property="og:title" content="好物雷達 GoodRadar｜所有連結">
<meta property="og:description" content="酷澎・蝦皮優惠、線上下載工具、免費小遊戲。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0a1512">
<link rel="icon" href="img/threads_128.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#08120f;--card:#0f211b;--line:rgba(255,255,255,.10);--gold:#ffd479;--txt:#e9f1f5;--dim:#9db0bd}
html,body{margin:0;padding:0;background:radial-gradient(1200px 600px at 50% -10%,#12362b 0%,#08120f 60%) no-repeat,var(--bg);color:var(--txt);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:26px 16px 40px}
.brand{text-align:center;margin-bottom:22px}
.brand img{width:78px;height:78px;border-radius:50%;border:2px solid var(--gold);background:#0b1a16;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
h1{font-size:20px;margin:12px 0 6px;letter-spacing:.02em}
.sub{color:var(--dim);font-size:13px;margin:0;line-height:1.7}
h2{font-size:13px;color:var(--gold);letter-spacing:.08em;margin:24px 4px 10px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0;position:relative;overflow:hidden;transition:transform .12s ease,border-color .12s}
a.card img.shot{width:100%;height:auto;display:block}
a.card:active{transform:scale(.98)}
a.card:hover{border-color:rgba(255,212,121,.55)}
.share{margin-top:26px;text-align:center}
.share button{appearance:none;border:1px solid rgba(255,212,121,.5);background:rgba(255,212,121,.12);color:var(--gold);padding:12px 22px;border-radius:999px;font-size:14px;cursor:pointer;font-family:inherit}
.share button:active{transform:scale(.98)}
.foot{margin-top:22px;color:#6f8592;font-size:11.5px;text-align:center;line-height:1.9}
.foot a{color:#8fa6b4;text-decoration:none;border-bottom:1px solid rgba(143,166,180,.35)}
@media(max-width:360px){.grid{gap:10px}}

/* 分享：多平台圖示列（桌機顯示；手機用系統分享） */
.shrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.sh{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:38px;padding:0 14px;border-radius:999px;
  font-size:12.5px;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.18)}
.sh:active{transform:scale(.97)}
.sh.line{background:#06C755}
.sh.fb{background:#1877F2}
.sh.th{background:#000;border-color:#333}
.sh.x{background:#111;border-color:#333}
.sh.tg{background:#229ED9}
.sh.wa{background:#25D366;color:#06301a}
.sh.copy{background:rgba(255,212,121,.14);color:var(--gold);border-color:rgba(255,212,121,.5);cursor:pointer;font-family:inherit}

.grid.three a.card:nth-child(3){grid-column:span 2}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="cards/threads.png" alt="羅家榮" style="object-fit:cover">
    <h1>羅家榮</h1>
    <p class="sub">看到覺得不錯的東西就放上來<br>你可以先看看，喜歡再自己決定</p>
  </div>

  <h2>🛍 先逛這裡</h2>
  <div class="grid">
      <a class="card" href="https://coupa.ng/cqmRjw" target="_blank" rel="noopener"><img class="shot" src="cards/coupang.png?v=2" alt="酷澎 Coupang"></a>
      <a class="card" href="https://s.shopee.tw/3qO62pbr04" target="_blank" rel="noopener"><img class="shot" src="cards/shopee.png?v=2" alt="蝦皮 Shopee"></a>
  </div>

  <h2>🎮 先玩再說</h2>
  <div class="grid three">
      <a class="card" href="https://kenqplay.com/zh-tw/" target="_blank" rel="noopener"><img class="shot" src="cards/kenq.png?v=2" alt="啃Q 小遊戲"></a>
      <a class="card" href="https://scefo.com/" target="_blank" rel="noopener"><img class="shot" src="cards/scefo.png?v=2" alt="轉運站"></a>
      <a class="card" href="https://v8i8.com/" target="_blank" rel="noopener"><img class="shot" src="cards/v8i8.png?v=2" alt="v8i8 去水印"></a>
  </div>

  <h2>👋 找我</h2>
  <div class="grid three">
      <a class="card" href="https://www.facebook.com/share/19XfJBHruF/?mibextid=wwXIfr" target="_blank" rel="noopener"><img class="shot" src="cards/fb.png" alt="Facebook"></a>
      <a class="card" href="https://www.instagram.com/iaiasoho" target="_blank" rel="noopener"><img class="shot" src="cards/instagram.png" alt="Instagram"></a>
      <a class="card" href="https://www.threads.com/@iaiasoho" target="_blank" rel="noopener"><img class="shot" src="cards/threads2.png" alt="脆 Threads"></a>
  </div>

  <div class="share">
    <button id="shareBtn" type="button">📤 分享給朋友</button>
    <div class="shrow" id="shRow" hidden>
      <a class="sh line" data-sh="line" href="#">LINE</a>
      <a class="sh fb" data-sh="fb" href="#">Facebook</a>
      <a class="sh th" data-sh="threads" href="#">脆</a>
      <a class="sh x" data-sh="x" href="#">X</a>
      <a class="sh tg" data-sh="telegram" href="#">Telegram</a>
      <a class="sh wa" data-sh="whatsapp" href="#">WhatsApp</a>
      <button class="sh copy" id="shCopy" type="button">複製連結</button>
    </div>
  </div>

  <p class="foot">
    我可能會從合作夥伴的活動中收取佣金，不影響你購買的價格。<br>
    © 羅家榮
  </p>
</div>
<script>
(function () {
  var url = location.href;
  var text = '好物雷達 GoodRadar｜酷澎・蝦皮的優惠，還有線上下載工具與免費小遊戲';
  var btn = document.getElementById('shareBtn');
  var row = document.getElementById('shRow');

  // 手機：直接用系統分享（會跳出 LINE／FB／微信… 的選單）
  function canNative() { return !!(navigator.share); }
  function showRow() { if (row) row.hidden = false; if (btn) btn.textContent = '📤 分享給朋友'; }
  function copyLink(msgEl) {
    var done = function () { if (msgEl) { msgEl.textContent = '已複製'; setTimeout(function(){ msgEl.textContent = '複製連結'; }, 1600); } };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, function () { prompt('複製這個連結分享：', url); });
    } else { prompt('複製這個連結分享：', url); }
  }

  if (btn) {
    btn.addEventListener('click', function () {
      if (canNative()) {
        navigator.share({ title: '好物雷達 GoodRadar', text: text, url: url }).catch(function () { showRow(); });
      } else {
        showRow();   // 桌機 / 不支援 → 顯示平台圖示
      }
    });
  }

  // 平台連結（純 URL，無 SDK）
  var T = encodeURIComponent(text), U = encodeURIComponent(url);
  var LINKS = {
    line: 'https://social-plugins.line.me/lineit/share?url=' + U + '&text=' + T,
    fb: 'https://www.facebook.com/sharer/sharer.php?u=' + U,
    threads: 'https://www.threads.com/intent/post?text=' + T + '%20' + U,
    x: 'https://twitter.com/intent/tweet?url=' + U + '&text=' + T,
    telegram: 'https://t.me/share/url?url=' + U + '&text=' + T,
    whatsapp: 'https://wa.me/?text=' + T + '%20' + U
  };
  Array.prototype.forEach.call(document.querySelectorAll('.sh[data-sh]'), function (a) {
    var key = a.getAttribute('data-sh');
    if (LINKS[key]) a.href = LINKS[key];
    a.target = '_blank'; a.rel = 'noopener';
  });
  var cp = document.getElementById('shCopy');
  if (cp) cp.addEventListener('click', function () { copyLink(cp); });

  // 桌機：直接把平台列顯示出來（不用先按）
  if (!canNative()) showRow();
})();
</script>
</body>
</html>
